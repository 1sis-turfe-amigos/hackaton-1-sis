<!DOCTYPE html>

    <link rel="icon" href="imagens/turfe.jpg">

    <link rel="stylesheet" href="style.css">
</head>

    <div id="app">

        </div>

        <table>

                <tr>

                    <th>V4</th>
                    <th>V5</th>
                    <th>V6</th>

            </thead>

            <tbody id="corpoTabela">

            </tbody>

        </table>

        <div id="podio">

        </div>

    </div>

    <script src="script.js"></script>
